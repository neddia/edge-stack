name: edge-app

networks:
  core:
    external: true
    name: edge_core

services:
  site-agent:
    image: ${SITE_AGENT_IMAGE:-ghcr.io/neddia/site-agent:latest}
    restart: unless-stopped
    networks: [core]
    working_dir: /app
    env_file:
      - ../../site-pack/.env
    environment:
      PYTHONUNBUFFERED: "1"
      # Prefer token file emitted by influx-init
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_ORG: ${INFLUX_ORG:-edge-org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-edge-site}
      INFLUX_TOKEN_FILE: ${INFLUX_TOKEN_FILE:-/secrets/influx.token}
      # Storage paths inside container
      SITE_CONFIG_PATH: ${SITE_CONFIG_PATH:-/app/storage/site-config.yml}
      PROFILES_DIR: ${PROFILES_DIR:-/app/profiles}
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
      # ChirpStack endpoints by service name
      CS_GRPC_SERVER: ${CS_GRPC_SERVER:-chirpstack:8080}
      MQTT_HOST: ${MQTT_HOST:-chirpstack-mqtt:1883}
    volumes:
      - ../../site-pack/.secrets:/secrets:ro
      - ../../site-pack/storage:/app/storage:rw
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
