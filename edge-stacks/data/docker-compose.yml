name: edge-data

networks:
  core:
    external: true
    name: edge_core

volumes:
  influx-data:
  influx-config:
  grafana-data:

secrets:
  influx_admin_user:
    file: ../../site-pack/.secrets/influx.admin.user
  influx_admin_pass:
    file: ../../site-pack/.secrets/influx.admin.pass
  influx_admin_token:
    file: ../../site-pack/.secrets/influx.admin.token

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    networks: [core]
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influx_admin_user
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx_admin_pass
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-edge-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-edge-site}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx_admin_token
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    secrets:
      - influx_admin_user
      - influx_admin_pass
      - influx_admin_token
    healthcheck:
      test: ["CMD-SHELL", "influx ping --host http://localhost:8086 >/dev/null 2>&1 || wget -qO- http://localhost:8086/ready >/dev/null 2>&1 || curl -fsS http://localhost:8086/ready >/dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 40

  influx-init:
    image: alpine:3.20
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [core]
    secrets:
      - influx_admin_token
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-edge-org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-edge-site}
    volumes:
      - ../../site-pack/.secrets:/secrets
    entrypoint:
      - sh
      - -c
      - |
          set -e
          apk add --no-cache curl jq >/dev/null

          TOK="/secrets/influx.token"

          fix_perms() {
            chown 0:0 "$$TOK" 2>/dev/null || chown 472:0 "$$TOK" 2>/dev/null || chown 472:472 "$$TOK" 2>/dev/null || true
            chmod 640 "$$TOK" 2>/dev/null || chmod 644 "$$TOK" 2>/dev/null || true
          }

          if [ -s "$$TOK" ]; then
            SIZE=$$(wc -c < "$$TOK" || true)
            echo "site-agent token exists at $$TOK ($$SIZE bytes)"
            fix_perms
            exit 0
          fi

          ADMIN=$$(cat /run/secrets/influx_admin_token)

          echo "looking up org='$$INFLUX_ORG' bucket='$$INFLUX_BUCKET' at $$INFLUX_URL"

          ORG_ID=$$(curl -fsS -H "Authorization: Token $$ADMIN" \
            "$$INFLUX_URL/api/v2/orgs?org=$$INFLUX_ORG" | jq -r '.orgs[0].id')
          [ -n "$$ORG_ID" ] && [ "$$ORG_ID" != "null" ] || { echo "ERROR: could not resolve ORG_ID" >&2; exit 1; }
          echo "ORG_ID=$$ORG_ID"

          BKT_ID=$$(curl -fsS -H "Authorization: Token $$ADMIN" \
            "$$INFLUX_URL/api/v2/buckets?name=$$INFLUX_BUCKET&orgID=$$ORG_ID" | jq -r '.buckets[0].id')
          [ -n "$$BKT_ID" ] && [ "$$BKT_ID" != "null" ] || { echo "ERROR: could not resolve BKT_ID" >&2; exit 1; }
          echo "BKT_ID=$$BKT_ID"

          AUTH=$$(jq -n --arg org "$$ORG_ID" --arg bkt "$$BKT_ID" '{
            orgID:$$org,
            description:"site-agent token",
            permissions:[
              {action:"read",  resource:{type:"buckets", id:$$bkt}},
              {action:"write", resource:{type:"buckets", id:$$bkt}}
            ]
          }')

          TOKEN=$$(curl -fsS -X POST \
            -H "Authorization: Token $$ADMIN" \
            -H "Content-Type: application/json" \
            "$$INFLUX_URL/api/v2/authorizations" \
            -d "$$AUTH" | jq -r '.token')

          LEN=$$(printf '%s' "$$TOKEN" | wc -c | tr -d ' ')
          [ "$$TOKEN" != "null" ] && [ "$$LEN" -ge 20 ] || { echo "ERROR: got invalid token (len=$$LEN)" >&2; exit 1; }

          # write WITHOUT newline
          printf '%s' "$$TOKEN" > "$$TOK"
          fix_perms
          echo "created token at $$TOK ($$LEN chars)"

  grafana:
    image: grafana/grafana:10.2.5
    user: "472:0"
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
      influx-init:
        condition: service_completed_successfully
    networks: [core]
    env_file:
      - ../../site-pack/.secrets/.env.grafana
      - ../../site-pack/.secrets/.env.smtp
    environment:

      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../site-pack/.secrets:/secrets:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  telegraf:
    image: telegraf:1.29
    user: "0:0"
    restart: unless-stopped
    depends_on:
      influx-init:
        condition: service_completed_successfully
    networks: [core]
    environment:
      INFLUX_ORG: ${INFLUX_ORG:-edge-org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-edge-site}
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      - ../../site-pack/.secrets:/secrets:ro
    command:
      - sh
      - -c
      - |
          export INFLUX_TOKEN="$(cat /secrets/influx.token)"
          exec telegraf --config /etc/telegraf/telegraf.conf
