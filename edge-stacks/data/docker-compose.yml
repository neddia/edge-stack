version: "3.9"
name: edge-data

networks:
  core:
    external: true
    name: edge_core

volumes:
  influx-data:
  influx-config:
  grafana-data:

secrets:
  influx_admin_user:
    file: ../../site-pack/.secrets/influx.admin.user
  influx_admin_pass:
    file: ../../site-pack/.secrets/influx.admin.pass
  influx_admin_token:
    file: ../../site-pack/.secrets/influx.admin.token

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    networks: [core]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influx_admin_user
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx_admin_pass
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-edge-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-edge-site}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx_admin_token
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    secrets:
      - influx_admin_user
      - influx_admin_pass
      - influx_admin_token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/ready"]
      interval: 3s
      timeout: 2s
      retries: 40

  influx-init:
    image: alpine:3.20
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [core]
    secrets:
      - influx_admin_token
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-edge-org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-edge-site}
    volumes:
      - ../../site-pack/.secrets:/secrets
    entrypoint: >
      sh -c '
        set -e
        apk add --no-cache curl jq >/dev/null
        TOK="/secrets/influx.token"
        if [ -s "$TOK" ]; then echo "site-agent token exists"; exit 0; fi
        ADMIN=$(cat /run/secrets/influx_admin_token)
        BKT_ID=$(curl -fsS -H "Authorization: Token $ADMIN" "$INFLUX_URL/api/v2/buckets?name=$INFLUX_BUCKET" | jq -r ".buckets[0].id")
        ORG_ID=$(curl -fsS -H "Authorization: Token $ADMIN" "$INFLUX_URL/api/v2/orgs?org=$INFLUX_ORG" | jq -r ".orgs[0].id")
        AUTH=$(cat <<JSON
        {"orgID":"$ORG_ID","description":"site-agent token","permissions":[
         {"action":"read","resource":{"type":"buckets","id":"$BKT_ID"}},
         {"action":"write","resource":{"type":"buckets","id":"$BKT_ID"}}]}
JSON
)
        curl -fsS -X POST -H "Authorization: Token $ADMIN" -H "Content-Type: application/json" \
             "$INFLUX_URL/api/v2/authorizations" -d "$AUTH" | jq -r ".token" > "$TOK"
        chmod 600 "$TOK"
        echo "created token at $TOK"
      '

  grafana:
    image: grafana/grafana:10.2.5
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [core]
    env_file:
      - ../../site-pack/.secrets/.env.grafana
      - ../../site-pack/.secrets/.env.smtp
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../site-pack/.secrets:/secrets:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
